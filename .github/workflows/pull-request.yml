name: Pull Request

on:
  pull_request:
    branches: [main, master]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20'

jobs:
  # ================================
  # LINTING
  # ================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Lint backend (dotnet format)
        working-directory: backend
        run: dotnet format --verify-no-changes --verbosity diagnostic

  # ================================
  # UNIT TESTS (parallel with e2e)
  # ================================
  unit-test:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests with coverage
        working-directory: frontend
        run: npm run test:unit -- --coverage
        continue-on-error: false

      - name: Run backend unit tests with coverage
        working-directory: backend
        run: |
          dotnet test TripPlanner.sln \
            --filter "TestCategory=Unit" \
            --configuration Release \
            --logger "trx;LogFileName=unit-test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: frontend/coverage
          retention-days: 7

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: backend/TestResults
          retention-days: 7

  # ================================
  # STATUS COMMENT
  # ================================
  status-comment:
    name: PR Status Comment
    needs: [lint, unit-test]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Sprawdz czy wszystkie joby przeszly
            const jobs = ['lint', 'unit-test'];

            const comment = `## Pull Request Status Report

            | Job | Status |
            |-----|--------|
            | Lint | :white_check_mark: Passed |
            | Unit Tests | :white_check_mark: Passed |

            ### Coverage Reports

            Coverage artifacts have been uploaded and are available in the workflow summary.

            ---
            :robot: *This comment was automatically generated by GitHub Actions*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
